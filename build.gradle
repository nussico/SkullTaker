plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'com.modrinth.minotaur' version '2.10.0'
}

base {
	archivesName = project.archives_base_name
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") { expand "version": version }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 25 }

// ./gradlew modrinth uploads the jar as a new version. Token: modrinth.token in ~/.gradle/gradle.properties.
modrinth {
	token = providers.gradleProperty("modrinth.token").orElse("")
	projectId = "skulltaker"
	versionNumber = project.version
	versionType = "release"
	uploadFile = jar
	gameVersions = ["26.1", "26.1.1", "26.1.2", "26.2", "26.3"]
	loaders = ["fabric"]
	syncBodyFrom = rootProject.file("README.md").text
	dependencies {
		required.project "fabric-api"
	}
}
